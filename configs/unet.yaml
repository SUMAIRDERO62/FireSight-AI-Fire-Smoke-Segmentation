# FireSight AI: two-channel multi-label U-Net
seed: 42
data:
  train_root: data/processed/phase05_fair/unet/train
  val_root: data/processed/phase05_fair/unet/val
image:
  height: 256
  width: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
training:
  epochs: 50
  batch_size: 4
  num_workers: 0
  gradient_clip: 1.0
  early_stopping_patience: 8
  min_delta: 0.0001
optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001
scheduler:
  enabled: true
  factor: 0.5
  patience: 3
  min_learning_rate: 0.000001
model:
  in_channels: 3
  base_channels: 16
loss:
  bce_weight: 1.0
  dice_weight: 1.0
output:
  checkpoint_dir: models/checkpoints/phase05_unet
  history_dir: reports/training/phase05_unet
