[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firesight-ai"
version = "0.1.0"
description = "FireSight AI: comparative U-Net and YOLO11-seg fire-smoke image segmentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
segmentation = [
  "torch>=2.2",
  "ultralytics>=8.3",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

